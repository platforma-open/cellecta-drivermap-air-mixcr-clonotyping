[project]
name = "cellecta-drivermap-air-vbc-scripts"
version = "0.0.0"
description = "Test/lint harness for the Cellecta DriverMap AIR block Python software (vbc-filtering, vbc-normalization, hash-column). Production deps are each package's requirements.txt; this dev group mirrors them for tests."
requires-python = ">=3.12.0, <3.13"

[dependency-groups]
dev = [
    # vbc-filtering runtime (software/vbc-filtering/src/requirements.txt)
    "pandas==2.2.3",
    "numpy==2.2.4",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
    # hash-column runtime (software/hash-column/src/requirements.txt).
    # Production ships polars-lts-cpu for older-CPU compatibility; the test env uses
    # regular polars pinned to the same version (the lts-cpu and regular distributions
    # both provide the `polars` module and cannot be co-installed). Hashing is identical.
    "polars-hash==0.5.2",
    "polars==1.23.0",
    # test tooling
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["vbc-filtering/src", "vbc-normalization/src", "hash-column/src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["vbc-filtering/src", "vbc-normalization/src", "hash-column/src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg",
    ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d",
    ".pyenv", ".pytest_cache", ".pytype", ".ruff_cache", ".svn",
    ".tox", ".venv", ".vscode", "__pypackages__", "_build",
    "buck-out", "build", "dist", "node_modules", "site-packages", "venv",
]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
