[project]
name = "cellecta-drivermap-air-vbc-scripts"
version = "0.0.0"
description = "Dependency source-of-truth + test/lint harness for the block's Python software. Each package's src/requirements.txt is GENERATED from the matching dependency group below via `pnpm deps:export` — edit dependencies here, never in requirements.txt."
requires-python = ">=3.12.0, <3.13"

[dependency-groups]
# --- Production runtime deps: the single source of truth for each software package's
#     src/requirements.txt. After editing, run `pnpm deps:export` (repo root) to
#     regenerate the .txt files; CI fails if they drift (see python-tests.yaml). ---
vbc-filtering = [
    "pandas==2.2.3",
    "numpy==2.2.4",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
]
vbc-normalization = [
    "pandas==2.2.3",
]
hash-column = [
    "polars-hash==0.5.2",
    "polars-lts-cpu==1.23.0",
]

# --- Test / lint environment: what `uv sync` installs to run pytest + ruff. Composes the
#     production groups so tests exercise the real libs, with one swap: it uses regular
#     `polars` instead of `polars-lts-cpu`. polars-lts-cpu and the `polars` that polars-hash
#     pulls in both provide the `polars` module and cannot co-install; hashing output is
#     identical. Production keeps polars-lts-cpu for older-CPU compatibility. ---
dev = [
    { include-group = "vbc-filtering" },
    { include-group = "vbc-normalization" },
    "polars-hash==0.5.2",
    "polars==1.23.0",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["vbc-filtering/src", "vbc-normalization/src", "hash-column/src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["vbc-filtering/src", "vbc-normalization/src", "hash-column/src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg",
    ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d",
    ".pyenv", ".pytest_cache", ".pytype", ".ruff_cache", ".svn",
    ".tox", ".venv", ".vscode", "__pypackages__", "_build",
    "buck-out", "build", "dist", "node_modules", "site-packages", "venv",
]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
