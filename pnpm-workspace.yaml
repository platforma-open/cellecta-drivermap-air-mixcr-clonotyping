  "@platforma-sdk/block-tools": 2.17.1
  "@platforma-sdk/test": 1.86.6
  "@platforma-sdk/tengo-builder": 4.1.15
  "@platforma-sdk/package-builder": 3.16.2

  "@platforma-open/milaboratories.runenv-python-3": ^1.1.16
  "@platforma-open/milaboratories.software-mixcr": 4.7.0-415-develop
