  "@platforma-open/milaboratories.software-binary-collection": 1.0.12

  "vue": 3.5.44

  "typescript": ~5.5.4
  "turbo": ~2.11.10
  "js-yaml": "^4.1.0"

  'ag-grid-enterprise': &ag-grid ~34.1.2
  'ag-grid-vue3': *ag-grid
  "vitest": ^4.0.18
  "zod": ~3.25.76

  "@changesets/cli": ^2.27.9
